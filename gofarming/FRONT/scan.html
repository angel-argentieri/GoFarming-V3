<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escanear — GoFarming</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="manifest" href="/gofarming/PUBLIC/manifest.json">
    
    <!-- PWA Settings -->
    <meta name="theme-color" content="#2e7d32">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="GoFarming">
    <link rel="apple-touch-icon" href="/gofarming/FRONT/css/Logo.png">
    
    <style>
        :root {
            --neon: #b490ff;
            --neon-glow: rgba(180, 144, 255, 0.4);
            --border: rgba(167, 139, 250, 0.25);
            --text-muted: #8b8b9e;
            --bg-dark: #0d0d12;
        }

        body {
            background-color: var(--bg-dark);
            color: #ffffff;
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            padding-bottom: 30px;
        }

        /* --- Cabeçalho --- */
        .scan-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 20px;
            background: rgba(13, 13, 18, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 20;
        }

        .btn-voltar {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: var(--neon);
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            padding: 6px 12px;
            border-radius: 20px;
            background: rgba(180, 144, 255, 0.08);
            border: 1px solid rgba(180, 144, 255, 0.15);
            transition: all 0.2s ease;
        }

        .btn-voltar:hover {
            background: rgba(180, 144, 255, 0.2);
            border-color: var(--neon);
            transform: translateX(-2px);
        }

        .header-title {
            font-size: 16px;
            font-weight: 600;
            color: #ffffff;
            margin: 0;
            letter-spacing: 0.3px;
            text-shadow: 0 0 10px var(--neon-glow);
        }

        .header-spacer {
            width: 80px;
        }

        /* --- Container Principal (Centralizado) --- */
        .scanner-container {
            max-width: 420px;
            margin: 20px auto;
            padding: 0 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* --- Cartão da Câmera --- */
        #camera-area {
            position: relative;
            width: 100%;
            aspect-ratio: 1;
            background: #000000;
            overflow: hidden;
            border-radius: 24px;
            border: 1px solid var(--border);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), 0 0 20px rgba(180, 144, 255, 0.15);
        }

        #video, #preview {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        #preview {
            display: none;
        }

        /* Moldura de scanner */
        .frame {
            position: absolute;
            inset: 32px;
            border: none;
            pointer-events: none;
        }

        .frame::before, .frame::after,
        .frame-b::before, .frame-b::after {
            content: '';
            position: absolute;
            width: 24px;
            height: 24px;
            border-color: var(--neon);
            border-style: solid;
        }

        .frame::before { top: 0; left: 0; border-width: 3px 0 0 3px; border-radius: 8px 0 0 0; }
        .frame::after  { top: 0; right: 0; border-width: 3px 3px 0 0; border-radius: 0 8px 0 0; }
        .frame-b::before { bottom: 0; left: 0; border-width: 0 0 3px 3px; border-radius: 0 0 0 8px; }
        .frame-b::after  { bottom: 0; right: 0; border-width: 0 3px 3px 0; border-radius: 0 0 8px 0; }

        .laser {
            position: absolute;
            left: 32px;
            right: 32px;
            height: 2px;
            background: var(--neon);
            opacity: 0.8;
            box-shadow: 0 0 12px var(--neon);
            animation: laser 2.2s ease-in-out infinite;
        }

        @keyframes laser {
            0%, 100% { top: 36px; }
            50% { top: calc(100% - 36px); }
        }

        /* --- Barra de Controles Centralizada --- */
        .controls-bar {
            width: 100%;
            max-width: 420px;
            margin: 20px auto 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            box-sizing: border-box;
        }

        .control-placeholder {
            width: 44px;
            height: 44px;
        }

        /* Botão Principal de Tirar Foto (Centralizado) */
        #btn-captura {
            position: relative;
            bottom: auto;
            left: auto;
            transform: none;
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background: transparent;
            border: 3px solid var(--neon);
            box-shadow: 0 0 15px var(--neon-glow);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            transition: transform 0.2s ease;
        }

        #btn-captura:active {
            transform: scale(0.92);
        }

        #btn-captura::after {
            content: '';
            width: 46px;
            height: 46px;
            border-radius: 50%;
            background: var(--neon);
        }

        /* Botão da Galeria na Direita */
        #btn-galeria {
            position: relative;
            bottom: auto;
            right: auto;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: rgba(13, 13, 18, 0.75);
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            backdrop-filter: blur(8px);
            transition: all 0.2s ease;
        }

        #btn-galeria:hover {
            border-color: var(--neon);
            transform: scale(1.05);
        }

        .spinner {
            width: 36px;
            height: 36px;
            border: 3px solid rgba(180, 144, 255, 0.2);
            border-top-color: var(--neon);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        #resultado {
            display: none;
            width: 100%;
            margin-top: 20px;
        }

        .card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 16px;
        }
    </style>
</head>
<body>

    <!-- Cabeçalho -->
    <header class="scan-header">
        <a href="dashboard.html" class="btn-voltar">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <line x1="19" y1="12" x2="5" y2="12"></line>
                <polyline points="12 19 5 12 12 5"></polyline>
            </svg>
            <span>Voltar</span>
        </a>

        <h1 class="header-title">Escanear Planta</h1>

        <div class="header-spacer"></div>
    </header>

    <!-- Conteúdo Principal -->
    <div class="scanner-container">
        
        <!-- Área da Câmera -->
        <div id="camera-area">
            <video id="video" autoplay playsinline></video>
            <img id="preview" alt="Pré-visualização">
            <div class="frame"></div>
            <div class="frame-b" style="position:absolute;inset:32px;pointer-events:none;"></div>
            <div class="laser" id="laser"></div>
        </div>

        <!-- Barra de Controles (Alinhada e Centralizada) -->
        <div class="controls-bar">
            <div class="control-placeholder"></div>
            
            <button id="btn-captura" onclick="capturar()"></button>

            <label for="input-arquivo" id="btn-galeria" title="Carregar da galeria">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--neon)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
                    <circle cx="8.5" cy="8.5" r="1.5"/>
                    <polyline points="21 15 16 10 5 21"/>
                </svg>
            </label>
            <input type="file" id="input-arquivo" accept="image/*" style="display:none;" onchange="selecionarArquivo(event)">
        </div>

        <!-- Indicador de Análise -->
        <div id="analisando" style="display:none; text-align:center; padding:20px 0;">
            <div class="spinner" style="margin: 0 auto 12px;"></div>
            <p style="color:var(--neon); margin: 0; font-weight: 500;">Identificando planta...</p>
        </div>

        <!-- Card de Resultado -->
        <div id="resultado">
            <div class="card">
                <div class="row" style="display: flex; gap: 12px; margin-bottom: 14px;">
                    <img id="foto-resultado" alt="Resultado da Planta" style="width:70px;height:70px;border-radius:12px;object-fit:cover;border:1.5px solid var(--border);">
                    <div>
                        <div id="nome-planta" style="font-size:18px;font-weight:700;"></div>
                        <div id="especie-planta" style="color:var(--text-muted);font-size:13px;"></div>
                        <div id="confianca-planta" style="color:var(--neon);font-size:12px;margin-top:4px;"></div>
                    </div>
                </div>
                <div style="background:rgba(0,0,0,0.4);border-radius:12px;padding:12px;margin-bottom:14px;">
                    <div class="muted" style="font-size:11px;color:var(--text-muted);margin-bottom:4px;">FREQUÊNCIA DE REGA</div>
                    <div id="frequencia-planta" style="font-size:14px;"></div>
                </div>
                <div class="gap" style="display: flex; gap: 8px;">
                    <button class="btn btn-primary" onclick="salvarNoJardim()" style="flex:1;">Adicionar ao jardim</button>
                    <button class="btn btn-outline" onclick="reiniciar()" style="flex:1;">Tentar novamente</button>
                </div>
            </div>
        </div>

    </div>

    <canvas id="canvas" style="display:none;"></canvas>

    <script src="js/api.js"></script>
    <script src="js/scan.js"></script>
</body>
</html>
